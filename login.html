{% extends 'base.html' %}
{% block title %}Admin login | EventFlow{% endblock %}
{% block content %}
<div class="row justify-content-center py-4"><div class="col-md-8 col-lg-5"><form method="post" class="card form-card border-0"><div class="card-body p-4 p-md-5"><p class="eyebrow">EVENTFLOW ADMIN</p><h1 class="h2">Administrator login</h1><p class="text-muted">Sign in to manage your event securely.</p><label class="form-label mt-3" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required><label class="form-label mt-3" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary mt-4 w-100">Admin login</button></div></form></div></div>
{% endblock %}
