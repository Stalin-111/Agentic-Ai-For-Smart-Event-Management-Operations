{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1>Attendees</h1><a href="{{ url_for('register') }}" class="btn btn-primary">+ Register attendee</a></div><form class="input-group mb-3"><input name="q" class="form-control" placeholder="Search name, email, or phone" value="{{ query }}"><button class="btn btn-outline-primary">Search</button></form>
<div class="card border-0 shadow-sm table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Name</th><th>Event</th><th>City</th><th>Status</th><th></th></tr></thead><tbody>{% for a in attendees %}<tr><td><strong>{{ a.name }}</strong><br><small>{{ a.email }}</small></td><td>{{ a.event }}</td><td>{{ a.city }}</td><td><span class="badge text-bg-{{ 'success' if a.checked_in else 'secondary' }}">{{ 'Checked in' if a.checked_in else 'Pending' }}</span></td><td><a href="{{ url_for('attendee_detail', attendee_id=a.id) }}">View</a></td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No attendees found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
